name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Install Mobile Dependencies
        working-directory: ./mobile
        run: |
          npm install --legacy-peer-deps

      - name: ⚙️ Expo Prebuild (Generate Native Android Project)
        working-directory: ./mobile
        run: |
          npx expo prebuild --platform android --clean

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Make Gradle Wrapper Executable
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew

      - name: 🚀 Build Android Debug APK
        working-directory: ./mobile/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📂 Prepare APK Output
        run: |
          mkdir -p apk_output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk apk_output/daily-expense-tracker.apk
          echo "APK generated successfully:"
          ls -lh apk_output/daily-expense-tracker.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-expense-tracker-apk
          path: apk_output/daily-expense-tracker.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Daily Expense Tracker APK v1.0.0
          body: |
            ### 📱 Daily Expense Tracker Android App
            
            Download and install the APK directly on your Android phone:
            - **File**: `daily-expense-tracker.apk`
            
            #### Instructions:
            1. Download `daily-expense-tracker.apk` below.
            2. Open the file on your Android device.
            3. If prompted, allow "Install from unknown sources".
            4. Enjoy tracking your daily expenses!
          files: apk_output/daily-expense-tracker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Push APK to Git Branch (apk-release)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-release
          mkdir -p releases
          cp apk_output/daily-expense-tracker.apk releases/daily-expense-tracker.apk
          git add -f releases/daily-expense-tracker.apk
          git commit -m "chore(release): update daily-expense-tracker.apk [skip ci]" || echo "No changes"
          git push origin apk-release --force
